<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的单词 · 词冼</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>我的单词</h1>

  <div class="nav">
    <a href="index.html">首页</a>
    <a href="install.html">安装</a>
    <a href="daily.html">每日学习</a>
    <a href="my-words.html" class="active">我的单词</a>
    <a href="sync.html">云同步</a>
    <a href="wordbook.html">词书格式</a>
    <a href="faq.html">常见问题</a>
  </div>

  <div class="card">
    <h2>三个分类</h2>
    <p>点击首页右上角星形图标进入"我的单词"，顶部有三个标签：</p>
    <table>
      <tr>
        <th>分类</th>
        <th>含义</th>
        <th>怎么进</th>
      </tr>
      <tr>
        <td>错题</td>
        <td>答错过的词</td>
        <td>每日学习中答错自动进入</td>
      </tr>
      <tr>
        <td>已掌握</td>
        <td>你认为已经记牢的词</td>
        <td>手动点击"标记已掌握"</td>
      </tr>
      <tr>
        <td>收藏</td>
        <td>你想重点关注的词</td>
        <td>列表里点星星图标</td>
      </tr>
    </table>
  </div>

  <div class="card">
    <h2>操作</h2>
    <ul>
      <li><b>标记已掌握</b>：错题右侧的绿色对勾按钮</li>
      <li><b>收藏 / 取消收藏</b>：黄色星星按钮</li>
      <li><b>移除</b>：右侧的删除按钮</li>
      <li><b>查看详情</b>：点击单词本身</li>
    </ul>
  </div>

  <div class="card">
    <h2>收藏的作用</h2>
    <p>收藏与错题 / 已掌握互不影响，可以同时存在。</p>
    <p>单词列表里的星星图标和"我的单词"里的收藏是同一个数据。</p>
  </div>

  <a class="back" href="index.html">返回首页</a>
</body>
</html>
