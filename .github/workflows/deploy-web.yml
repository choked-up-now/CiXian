name: Deploy to Netlify, Cloudflare and GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 给 GitHub Pages 授权
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # --- 第一次构建：给 Netlify 和 Cloudflare 用（不带 base-href） ---
      - name: Build Web for Netlify & Cloudflare
        run: flutter build web --release
        env:
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          PUB_HOSTED_URL: https://pub.flutter-io.cn

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './build/web'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=cixian

      # --- 第二次构建：专门给 GitHub Pages 用（带 base-href） ---
      - name: Build Web for GitHub Pages
        run: flutter build web --release --base-href /CiXian/
        env:
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          PUB_HOSTED_URL: https://pub.flutter-io.cn

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4